# Project metadata and tool configuration.
#
# This project is run as a set of scripts, not installed as a library, so there
# is deliberately no [build-system] table and nothing here builds a wheel. The
# file exists to give pytest and the linters one place to read their settings
# from, and to record the Python floor in a machine-readable way rather than
# only in prose in the README.
#
# Runtime dependencies stay in requirements.txt, which is what the README and
# REPORT.md tell a reader to install from.

[project]
name = "adaptive-traffic-signal-control"
version = "1.0.0"
description = "Deep reinforcement learning for adaptive traffic signal control in SUMO"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# Tests live in tests/ and import the project's packages from the repo root,
# which pytest puts on sys.path because of the rootdir setting below.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# The rule set is pinned explicitly rather than left to ruff's default, because
# that default has widened between ruff releases: running `ruff check` with a
# newer binary was reporting 282 findings against a codebase that had none, all
# but one of them stylistic. An unpinned linter selection is the same class of
# problem as an unpinned dependency - the command stops meaning the same thing
# from one machine to the next.
#
# E4/E7/E9 are the pycodestyle errors that are actually errors, F is pyflakes
# (undefined names, unused imports - the ones that catch bugs), W is whitespace.
select = ["E4", "E7", "E9", "F", "W"]

# E501 is off because several docstrings quote SUMO phase strings and command
# lines that are clearer left intact than wrapped.
ignore = ["E501"]

# Not selected, deliberately: UP031 (printf-string-formatting). This project
# uses %-formatting consistently, including inside the generators that write
# REPORT.md, and converting ~180 call sites during a verification pass would
# risk a silent formatting change in a published table to gain nothing.

[tool.ruff.lint.per-file-ignores]
# Every entry point has to configure SUMO's import paths before importing
# anything that talks to SUMO, so module-level imports legitimately follow
# executable statements in these files.
"agent/*.py" = ["E402"]
"baseline/*.py" = ["E402"]
"eval/*.py" = ["E402"]
"networks/*.py" = ["E402"]
"smoke_test.py" = ["E402"]
"tests/*.py" = ["E402"]
